<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Flat Light Sky Blue Globe with Borders & City Pointers</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #cce7ff;
            /* very light sky blue */
            font-family: Arial, sans-serif;
        }

        #countrySelect {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            background: white;
        }

        #globeViz {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <select id="countrySelect">
        <option value="">Select a Country</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="Brazil">Brazil</option>
        <option value="Japan">Japan</option>
    </select>

    <div id="globeViz"></div>

    <script src="https://unpkg.com/globe.gl"></script>
    <script>
        const globe = Globe()(document.getElementById('globeViz'))
            // Light blue Earth texture from https://planetpixelemporium.com/earth.html (converted to light version)
            .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundImageUrl('') // keep transparent background
            .polygonsData([])
            .polygonAltitude(0.02) // very flat polygons
            .polygonCapColor(() => 'rgba(180, 220, 255, 0.5)') // pastel sky blue land
            .polygonSideColor(() => 'rgba(180, 220, 255, 0)') // no side depth
            .polygonStrokeColor(() => 'rgba(135, 206, 250, 0.3)') // faint borders
            .polygonLabel(({ properties: d }) =>
            {
                if (!d || !d.ADMIN) return '';
                return `<b>${d.ADMIN}</b><br />${d.ISO_A2 || ''}`;
            })
            .onPolygonHover((hoverD) =>
            {
                globe
                    .polygonAltitude(d => d === hoverD ? 0.06 : 0.02)
                    .polygonCapColor(d => d === hoverD ? 'rgba(255, 255, 255, 0.8)' : 'rgba(180, 220, 255, 0.5)');
            })
            .pointsData([])
            .pointAltitude(0.04)
            .pointColor(() => 'crimson')
            .pointRadius(0.7)
            .pointLabel(d => `<b>${d.name}</b>`);

        // Load countries GeoJSON
        fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
            .then(res => res.json())
            .then(countries =>
            {
                globe.polygonsData(countries.features);
            });

        const countryCoords = {
            India: { lat: 20.5937, lng: 78.9629 },
            USA: { lat: 37.0902, lng: -95.7129 },
            Brazil: { lat: -14.2350, lng: -51.9253 },
            Japan: { lat: 36.2048, lng: 138.2529 }
        };

        const countryCities = {
            India: [
                { name: "New Delhi", lat: 28.6139, lng: 77.2090 },
                { name: "Jaipur", lat: 26.9124, lng: 75.7873 }
            ],
            USA: [
                { name: "Washington D.C.", lat: 38.9072, lng: -77.0369 },
                { name: "New York", lat: 40.7128, lng: -74.0060 }
            ],
            Brazil: [
                { name: "Brasília", lat: -15.7939, lng: -47.8828 },
                { name: "Rio de Janeiro", lat: -22.9068, lng: -43.1729 }
            ],
            Japan: [
                { name: "Tokyo", lat: 35.6762, lng: 139.6503 },
                { name: "Kyoto", lat: 35.0116, lng: 135.7681 }
            ]
        };

        let selectedCountry = null;

        document.getElementById('countrySelect').addEventListener('change', e =>
        {
            const country = e.target.value;

            if (!country)
            {
                selectedCountry = null;
                globe.polygonCapColor(() => 'rgba(180, 220, 255, 0.5)');
                globe.pointsData([]); // clear city markers
                globe.pointOfView({ lat: 0, lng: 0, altitude: 2 }, 1500);
                return;
            }

            selectedCountry = country;
            const { lat, lng } = countryCoords[country];
            globe.pointOfView({ lat, lng, altitude: 1.5 }, 1500);

            globe.polygonCapColor(feature =>
            {
                if (!feature || !feature.properties) return 'rgba(180, 220, 255, 0.5)';
                return feature.properties.ADMIN === selectedCountry
                    ? 'rgba(255, 255, 200, 0.9)'
                    : 'rgba(180, 220, 255, 0.5)';
            });

            globe.pointsData(countryCities[country] || []);
        });

        globe.pointOfView({ lat: 0, lng: 0, altitude: 2 }, 0);
    </script>
</body>

</html>
